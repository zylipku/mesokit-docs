[project]
name = "mesokit"
requires-python = ">=3.12,<3.13"
version = "0.1.0"
description = "A toolkit and tutorial for learning mesoscopic dynamics from data."

[project.scripts]
mesokit = "mesokit.cli.main:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
log_cli = true
markers = ["slow: slow tests"]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
  "pragma: nocover",
  "raise NotImplementedError",
  "raise NotImplementedError()",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4

[tool.ruff.lint.isort]
known-third-party = ["torch", "neuralop", "dedalus"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = [
  # "E402", # module level import not at top of file
  # "E501", # line too long
  # "E741", # ambiguous variable name
  "B905", # Do not assert for zip
  "F541", # f-string without variables
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
